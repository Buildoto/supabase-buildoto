services:
  config-init:
    build: .
    volumes:
      - supabase-config:/shared
    restart: 'no'
    exclude_from_hc: true

  supabase-kong:
    image: 'kong/kong:3.9.1'
    entrypoint:
      - /bin/sh
      - '-c'
      - |
        cp /supabase-config/volumes/api/kong-entrypoint.sh /tmp/kong-entrypoint.sh
        cp /supabase-config/volumes/api/kong.yml /tmp/temp.yml
        chmod +x /tmp/kong-entrypoint.sh
        export KONG_TEMP_YML=/tmp/temp.yml
        exec /tmp/kong-entrypoint.sh
    depends_on:
      config-init:
        condition: service_completed_successfully
      supabase-analytics:
        condition: service_started
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - 'KONG_PORT_MAPS=443:8000'
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/kong.yml
      - 'KONG_DNS_ORDER=LAST,A,CNAME'
      - KONG_DNS_NOT_FOUND_TTL=1
      - 'KONG_PLUGINS=request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function'
      - KONG_NGINX_PROXY_PROXY_BUFFER_SIZE=160k
      - 'KONG_NGINX_PROXY_PROXY_BUFFERS=64 160k'
      - 'KONG_PROXY_ACCESS_LOG=/dev/stdout combined'
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      - 'SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}'
      - 'SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}'
      - 'ANON_KEY_ASYMMETRIC=${ANON_KEY_ASYMMETRIC:-}'
      - 'SERVICE_ROLE_KEY_ASYMMETRIC=${SERVICE_ROLE_KEY_ASYMMETRIC:-}'
      - 'DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-supabase}'
      - 'DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-this_password_is_insecure_and_should_be_updated}'
      - 'KONG_STORAGE_CONNECT_TIMEOUT=${KONG_STORAGE_CONNECT_TIMEOUT:-60}'
      - 'KONG_STORAGE_WRITE_TIMEOUT=${KONG_STORAGE_WRITE_TIMEOUT:-3600}'
      - 'KONG_STORAGE_READ_TIMEOUT=${KONG_STORAGE_READ_TIMEOUT:-3600}'
      - 'KONG_STORAGE_REQUEST_BUFFERING=${KONG_STORAGE_REQUEST_BUFFERING:-false}'
      - 'KONG_STORAGE_RESPONSE_BUFFERING=${KONG_STORAGE_RESPONSE_BUFFERING:-false}'
    volumes:
      - supabase-config:/supabase-config:ro

  supabase-studio:
    image: 'supabase/studio:2026.04.08-sha-205cbe7'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      config-init:
        condition: service_completed_successfully
      supabase-analytics:
        condition: service_started
    environment:
      - HOSTNAME=0.0.0.0
      - 'STUDIO_PG_META_URL=http://supabase-meta:8080'
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      - 'POSTGRES_HOST=${POSTGRES_HOST:-supabase-db}'
      - 'POSTGRES_PORT=${POSTGRES_PORT:-5432}'
      - 'POSTGRES_DB=${POSTGRES_DB:-postgres}'
      - 'PGRST_DB_SCHEMAS=${PGRST_DB_SCHEMAS:-public,storage,graphql_public}'
      - 'PGRST_DB_MAX_ROWS=${PGRST_DB_MAX_ROWS:-1000}'
      - 'PGRST_DB_EXTRA_SEARCH_PATH=${PGRST_DB_EXTRA_SEARCH_PATH:-public}'
      - 'DEFAULT_ORGANIZATION_NAME=${STUDIO_DEFAULT_ORGANIZATION:-Default Organization}'
      - 'DEFAULT_PROJECT_NAME=${STUDIO_DEFAULT_PROJECT:-Default Project}'
      - 'SUPABASE_URL=http://supabase-kong:8000'
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      - AUTH_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - 'PG_META_CRYPTO_KEY=${PG_META_CRYPTO_KEY:-your-super-secret-and-long-pg-meta-crypto-key}'
      - LOGFLARE_API_KEY=${LOGFLARE_API_KEY:-your-super-secret-and-long-logflare-key}
      - LOGFLARE_PUBLIC_ACCESS_TOKEN=${LOGFLARE_API_KEY:-your-super-secret-and-long-logflare-key}
      - 'LOGFLARE_PRIVATE_ACCESS_TOKEN=${LOGFLARE_PRIVATE_KEY:-your-super-secret-and-long-logflare-private-key}'
      - 'LOGFLARE_URL=http://supabase-analytics:4000'
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - NEXT_PUBLIC_ENABLE_LOGS=true
      - NEXT_ANALYTICS_BACKEND_PROVIDER=postgres
      - 'OPENAI_API_KEY=${OPENAI_API_KEY:-}'
      - SNIPPETS_MANAGEMENT_FOLDER=/app/snippets
      - EDGE_FUNCTIONS_MANAGEMENT_FOLDER=/app/edge-functions
    volumes:
      - supabase-config:/supabase-config:ro
      - supabase-snippets:/app/snippets
      - supabase-functions:/app/edge-functions

  supabase-db:
    image: 'supabase/postgres:15.8.1.085'
    healthcheck:
      test: 'pg_isready -U postgres -h 127.0.0.1'
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      config-init:
        condition: service_completed_successfully
      supabase-vector:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - '-c'
      - |
        mkdir -p /docker-entrypoint-initdb.d/migrations /docker-entrypoint-initdb.d/init-scripts
        cp /supabase-config/volumes/db/realtime.sql /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        cp /supabase-config/volumes/db/_supabase.sql /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
        cp /supabase-config/volumes/db/pooler.sql /docker-entrypoint-initdb.d/migrations/99-pooler.sql
        cp /supabase-config/volumes/db/logs.sql /docker-entrypoint-initdb.d/migrations/99-logs.sql
        cp /supabase-config/volumes/db/webhooks.sql /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        cp /supabase-config/volumes/db/roles.sql /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        cp /supabase-config/volumes/db/jwt.sql /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        exec /usr/local/bin/docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c log_min_messages=fatal
    environment:
      - POSTGRES_HOST=/var/run/postgresql
      - 'PGPORT=${POSTGRES_PORT:-5432}'
      - 'POSTGRES_PORT=${POSTGRES_PORT:-5432}'
      - PGPASSWORD=${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      - 'PGDATABASE=${POSTGRES_DB:-postgres}'
      - 'POSTGRES_DB=${POSTGRES_DB:-postgres}'
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - 'JWT_EXP=${JWT_EXPIRY:-3600}'
    volumes:
      - supabase-config:/supabase-config:ro
      - supabase-db-data:/var/lib/postgresql/data
      - supabase-db-config:/etc/postgresql-custom

  supabase-analytics:
    image: 'supabase/logflare:1.31.2'
    healthcheck:
      test: ['CMD', 'curl', 'http://127.0.0.1:4000/health']
      timeout: 5s
      interval: 5s
      retries: 10
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - LOGFLARE_NODE_HOST=127.0.0.1
      - DB_USERNAME=supabase_admin
      - DB_DATABASE=_supabase
      - 'DB_HOSTNAME=${POSTGRES_HOSTNAME:-supabase-db}'
      - 'DB_PORT=${POSTGRES_PORT:-5432}'
      - DB_PASSWORD=${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      - DB_SCHEMA=_analytics
      - LOGFLARE_PUBLIC_ACCESS_TOKEN=${LOGFLARE_API_KEY:-your-super-secret-and-long-logflare-key}
      - 'LOGFLARE_PRIVATE_ACCESS_TOKEN=${LOGFLARE_PRIVATE_KEY:-your-super-secret-and-long-logflare-private-key}'
      - LOGFLARE_SINGLE_TENANT=true
      - LOGFLARE_SUPABASE_MODE=true
      - 'POSTGRES_BACKEND_URL=postgresql://supabase_admin:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/_supabase'
      - POSTGRES_BACKEND_SCHEMA=_analytics
      - LOGFLARE_FEATURE_FLAG_OVERRIDE=multibackend=true

  supabase-vector:
    image: 'timberio/vector:0.54.0-alpine'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9001/health']
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 10s
    depends_on:
      config-init:
        condition: service_completed_successfully
    volumes:
      - supabase-config:/supabase-config:ro
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    environment:
      - LOGFLARE_PUBLIC_ACCESS_TOKEN=${LOGFLARE_API_KEY:-your-super-secret-and-long-logflare-key}
    command:
      - '--config'
      - /supabase-config/volumes/logs/vector.yml

  supabase-rest:
    image: 'postgrest/postgrest:v14.7'
    exclude_from_hc: true
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_started
    environment:
      - 'PGRST_DB_URI=postgres://authenticator:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}'
      - 'PGRST_DB_SCHEMAS=${PGRST_DB_SCHEMAS:-public,storage,graphql_public}'
      - 'PGRST_DB_MAX_ROWS=${PGRST_DB_MAX_ROWS:-1000}'
      - 'PGRST_DB_EXTRA_SEARCH_PATH=${PGRST_DB_EXTRA_SEARCH_PATH:-public}'
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - PGRST_DB_USE_LEGACY_GUCS=false
      - PGRST_APP_SETTINGS_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - 'PGRST_APP_SETTINGS_JWT_EXP=${JWT_EXPIRY:-3600}'
    command: postgrest

  supabase-auth:
    image: 'supabase/gotrue:v2.188.1'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:9999/health']
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - 'API_EXTERNAL_URL=${API_EXTERNAL_URL:-http://supabase-kong:8000}'
      - GOTRUE_DB_DRIVER=postgres
      - 'GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}'
      - GOTRUE_SITE_URL=${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      - 'GOTRUE_URI_ALLOW_LIST=${ADDITIONAL_REDIRECT_URLS:-}'
      - 'GOTRUE_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}'
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - 'GOTRUE_JWT_EXP=${JWT_EXPIRY:-3600}'
      - GOTRUE_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - 'GOTRUE_EXTERNAL_EMAIL_ENABLED=${ENABLE_EMAIL_SIGNUP:-true}'
      - 'GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED=${ENABLE_ANONYMOUS_USERS:-false}'
      - 'GOTRUE_MAILER_AUTOCONFIRM=${ENABLE_EMAIL_AUTOCONFIRM:-true}'
      - 'GOTRUE_SMTP_ADMIN_EMAIL=${SMTP_ADMIN_EMAIL:-admin@example.com}'
      - 'GOTRUE_SMTP_HOST=${SMTP_HOST:-smtp.example.com}'
      - 'GOTRUE_SMTP_PORT=${SMTP_PORT:-587}'
      - 'GOTRUE_SMTP_USER=${SMTP_USER:-}'
      - 'GOTRUE_SMTP_PASS=${SMTP_PASS:-}'
      - 'GOTRUE_SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-Supabase}'
      - 'GOTRUE_MAILER_URLPATHS_INVITE=${MAILER_URLPATHS_INVITE:-/auth/v1/verify}'
      - 'GOTRUE_MAILER_URLPATHS_CONFIRMATION=${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}'
      - 'GOTRUE_MAILER_URLPATHS_RECOVERY=${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}'
      - 'GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}'
      - 'GOTRUE_MAILER_TEMPLATES_INVITE=${MAILER_TEMPLATES_INVITE:-}'
      - 'GOTRUE_MAILER_TEMPLATES_CONFIRMATION=${MAILER_TEMPLATES_CONFIRMATION:-}'
      - 'GOTRUE_MAILER_TEMPLATES_RECOVERY=${MAILER_TEMPLATES_RECOVERY:-}'
      - 'GOTRUE_MAILER_TEMPLATES_MAGIC_LINK=${MAILER_TEMPLATES_MAGIC_LINK:-}'
      - 'GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE=${MAILER_TEMPLATES_EMAIL_CHANGE:-}'
      - 'GOTRUE_MAILER_SUBJECTS_CONFIRMATION=${MAILER_SUBJECTS_CONFIRMATION:-}'
      - 'GOTRUE_MAILER_SUBJECTS_RECOVERY=${MAILER_SUBJECTS_RECOVERY:-}'
      - 'GOTRUE_MAILER_SUBJECTS_MAGIC_LINK=${MAILER_SUBJECTS_MAGIC_LINK:-}'
      - 'GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE=${MAILER_SUBJECTS_EMAIL_CHANGE:-}'
      - 'GOTRUE_MAILER_SUBJECTS_INVITE=${MAILER_SUBJECTS_INVITE:-}'
      - 'GOTRUE_EXTERNAL_PHONE_ENABLED=${ENABLE_PHONE_SIGNUP:-true}'
      - 'GOTRUE_SMS_AUTOCONFIRM=${ENABLE_PHONE_AUTOCONFIRM:-true}'

  realtime-dev:
    image: 'supabase/realtime:v2.78.12'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-sSfL', '--head', '-o', '/dev/null', '-H', 'Authorization: Bearer ${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}', 'http://127.0.0.1:4000/api/tenants/realtime-dev/health']
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      - PORT=4000
      - 'DB_HOST=${POSTGRES_HOSTNAME:-supabase-db}'
      - 'DB_PORT=${POSTGRES_PORT:-5432}'
      - DB_USER=supabase_admin
      - DB_PASSWORD=${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      - 'DB_NAME=${POSTGRES_DB:-postgres}'
      - 'DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime'
      - DB_ENC_KEY=supabaserealtime
      - API_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - 'SECRET_KEY_BASE=${REALTIME_SECRET:-your-super-secret-and-long-realtime-secret-base-key-that-is-at-least-64-characters}'
      - METRICS_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - 'ERL_AFLAGS=-proto_dist inet_tcp'
      - "DNS_NODES=''"
      - RLIMIT_NOFILE=10000
      - APP_NAME=realtime
      - SEED_SELF_HOST=true
      - LOG_LEVEL=error
      - RUN_JANITOR=true
      - JANITOR_INTERVAL=60000
      - DISABLE_HEALTHCHECK_LOGGING=true
    command: >
      sh -c "/app/bin/migrate && /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)' && /app/bin/server"

  supabase-minio:
    image: 'ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z'
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123456}'
    command: 'server --console-address ":9001" /data'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 20s
      retries: 10
    volumes:
      - supabase-storage-data:/data

  minio-createbucket:
    image: minio/mc
    restart: 'no'
    exclude_from_hc: true
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123456}'
    depends_on:
      config-init:
        condition: service_completed_successfully
      supabase-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - '-c'
      - |
        cp /supabase-config/entrypoint.sh /tmp/entrypoint.sh
        chmod +x /tmp/entrypoint.sh
        exec /tmp/entrypoint.sh
    volumes:
      - supabase-config:/supabase-config:ro

  supabase-storage:
    image: 'supabase/storage-api:v1.48.26'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5000/status']
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - SERVER_PORT=5000
      - SERVER_REGION=local
      - MULTI_TENANT=false
      - AUTH_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - 'DATABASE_URL=postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}'
      - DB_INSTALL_ROLES=false
      - STORAGE_BACKEND=s3
      - STORAGE_S3_BUCKET=stub
      - 'STORAGE_S3_ENDPOINT=http://supabase-minio:9000'
      - STORAGE_S3_FORCE_PATH_STYLE=true
      - STORAGE_S3_REGION=us-east-1
      - 'AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}'
      - 'AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123456}'
      - UPLOAD_FILE_SIZE_LIMIT=524288000
      - UPLOAD_FILE_SIZE_LIMIT_STANDARD=524288000
      - UPLOAD_SIGNED_URL_EXPIRATION_TIME=120
      - TUS_URL_PATH=/upload/resumable
      - TUS_MAX_SIZE=3600000
      - ENABLE_IMAGE_TRANSFORMATION=true
      - 'IMGPROXY_URL=http://imgproxy:8080'
      - IMGPROXY_REQUEST_TIMEOUT=15
      - DATABASE_SEARCH_PATH=storage
      - NODE_ENV=production
      - REQUEST_ALLOW_X_FORWARDED_PATH=true
      - ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - SERVICE_KEY=${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      - 'POSTGREST_URL=http://supabase-rest:3000'
      - PGRST_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - STORAGE_PUBLIC_URL=${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      - 'TENANT_ID=${STORAGE_TENANT_ID:-storage-single-tenant}'
    volumes:
      - supabase-storage-data:/var/lib/storage

  imgproxy:
    image: 'darthsim/imgproxy:v3.30.1'
    healthcheck:
      test: ['CMD', 'imgproxy', 'health']
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - 'IMGPROXY_BIND=:8080'
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/
      - IMGPROXY_USE_ETAG=true
      - 'IMGPROXY_AUTO_WEBP=${IMGPROXY_AUTO_WEBP:-true}'
      - IMGPROXY_MAX_SRC_RESOLUTION=16.8
    volumes:
      - supabase-storage-data:/var/lib/storage

  supabase-meta:
    image: 'supabase/postgres-meta:v0.96.1'
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:8080/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 3
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_started
    environment:
      - PG_META_PORT=8080
      - 'PG_META_DB_HOST=${POSTGRES_HOSTNAME:-supabase-db}'
      - 'PG_META_DB_PORT=${POSTGRES_PORT:-5432}'
      - 'PG_META_DB_NAME=${POSTGRES_DB:-postgres}'
      - PG_META_DB_USER=supabase_admin
      - PG_META_DB_PASSWORD=${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      - 'CRYPTO_KEY=${PG_META_CRYPTO_KEY:-your-super-secret-and-long-pg-meta-crypto-key}'

  supabase-edge-functions:
    image: 'supabase/edge-runtime:v1.73.3'
    depends_on:
      config-init:
        condition: service_completed_successfully
      supabase-analytics:
        condition: service_started
    healthcheck:
      test: ['CMD', 'echo', 'Edge Functions is healthy']
      timeout: 5s
      interval: 5s
      retries: 3
    entrypoint:
      - /bin/sh
      - '-c'
      - |
        cp -a /supabase-config/volumes/functions/. /home/deno/functions/
        exec /usr/local/bin/edge-runtime start --main-service /home/deno/functions/main
    environment:
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - 'SUPABASE_URL=http://supabase-kong:8000'
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      - 'SUPABASE_DB_URL=postgresql://postgres:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}'
      - 'VERIFY_JWT=${FUNCTIONS_VERIFY_JWT:-false}'
    volumes:
      - supabase-config:/supabase-config:ro
      - supabase-functions:/home/deno/functions
      - deno-cache:/root/.cache/deno

  supabase-supavisor:
    image: 'supabase/supavisor:2.7.4'
    healthcheck:
      test: ['CMD', 'curl', '-sSfL', '-o', '/dev/null', 'http://127.0.0.1:4000/api/health']
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 30s
    depends_on:
      config-init:
        condition: service_completed_successfully
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_started
    entrypoint:
      - /bin/sh
      - '-c'
      - |
        mkdir -p /etc/pooler
        cp /supabase-config/volumes/pooler/pooler.exs /etc/pooler/pooler.exs
        if [ ! -f /etc/ssl/server.crt ]; then
          openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
            -keyout /etc/ssl/server.key -out /etc/ssl/server.crt \
            -subj "/CN=supabase-pooler"
        fi
        /app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server
    environment:
      - 'POOLER_TENANT_ID=${POOLER_TENANT_ID:-dev_tenant}'
      - POOLER_POOL_MODE=transaction
      - 'POOLER_DEFAULT_POOL_SIZE=${POOLER_DEFAULT_POOL_SIZE:-20}'
      - 'POOLER_MAX_CLIENT_CONN=${POOLER_MAX_CLIENT_CONN:-100}'
      - PORT=4000
      - 'POSTGRES_PORT=${POSTGRES_PORT:-5432}'
      - 'POSTGRES_HOSTNAME=${POSTGRES_HOSTNAME:-supabase-db}'
      - 'POSTGRES_DB=${POSTGRES_DB:-postgres}'
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      - 'DATABASE_URL=ecto://supabase_admin:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/_supabase'
      - CLUSTER_POSTGRES=true
      - 'SECRET_KEY_BASE=${SUPAVISOR_SECRET:-your-super-secret-and-long-supavisor-secret-base-key-that-is-at-least-64-chars}'
      - 'VAULT_ENC_KEY=${VAULT_ENC_KEY:-aGVsbG93b3JsZHRoaXNpc2FrZXkxMg==}'
      - API_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - METRICS_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      - REGION=local
      - 'ERL_AFLAGS=-proto_dist inet_tcp'
      - 'DB_POOL_SIZE=${POOLER_DB_POOL_SIZE:-5}'
      - GLOBAL_DOWNSTREAM_CERT_PATH=/etc/ssl/server.crt
      - GLOBAL_DOWNSTREAM_KEY_PATH=/etc/ssl/server.key
    volumes:
      - supabase-config:/supabase-config:ro

volumes:
  supabase-config:
  supabase-db-data:
  supabase-db-config:
  supabase-storage-data:
  supabase-functions:
  supabase-snippets:
  deno-cache:
